{% extends 'base.html' %}{% block body %}<h1>IoT Cold-Chain Project</h1><div class="card"><h2>Create shipment</h2><form method="post"><div class="grid"><input name="product" value="Sample Chilled Food" required><input name="origin" value="Supplier A" required><input name="destination" value="Retailer B" required><select name="route"><option>ROUTE_A</option><option>ROUTE_B</option><option>ROUTE_C</option></select><input name="device_id" value="TRUCK_01"><input name="min_temp" type="number" step=".1" value="20"><input name="max_temp" type="number" step=".1" value="27"><input name="allowed_excursion" type="number" value="20"><input name="moderate_impact" type="number" step=".01" value="0.35"><input name="severe_impact" type="number" step=".01" value="0.80"></div><button>Create shipment</button></form></div><div class="card"><h2>Existing shipments</h2><table><tr><th>ID</th><th>Route</th><th>Status</th></tr>{% for s in shipments %}<tr><td><a href="/dashboard/{{s.code}}">{{s.code}}</a></td><td>{{s.route}}</td><td>{{s.status}}</td></tr>{% endfor %}</table></div>{% endblock %}
